<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>慣老闆-推廣連結產生器</title>

<style>
body {
    font-family: Arial;
    background: #f5f5f5;
    padding: 20px;
    text-align: center;
}
.box {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 10px;
}
input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
}
button {
    padding: 12px;
    width: 100%;
    border: none;
    cursor: pointer;
    margin-top: 10px;
    color: white;
}
.btn-main { background: #ee4d2d; }
.btn-copy { background: #ff7a45; }
.btn-clear { background: #999; }
.result {
    margin-top: 15px;
    word-break: break-all;
    color: green;
}
</style>
</head>

<body>

<div class="box">

<h2>🔥 慣老闆 🔥</h2>
<h2>🤖推廣連結產生機器人🤖</h2>
<p>貼上商品連結，自動轉換優惠連結</p>

<input type="text" id="inputUrl" placeholder="貼上 Shopee 商品連結">

<button class="btn-main" onclick="handleLink(true)">
🔥 開啟推廣網頁並複製
</button>

<div class="result" id="result"></div>

<button class="btn-copy" onclick="handleLink(false)">
📋 複製推廣連結（不開啟網頁）
</button>

<button class="btn-clear" onclick="clearAll()">
🧹 一鍵清除
</button>

</div>

<script>

// ✅ 分潤參數（統一管理）
const AFF_PARAM = "mmp_pid=an_16376520008&utm_source=an_16376520008&utm_medium=affiliates";

// ✅ 抓商品ID
function extractIds(url) {
    let match1 = url.match(/product\/(\d+)\/(\d+)/);
    let match2 = url.match(/-i\.(\d+)\.(\d+)/);

    if (match1) return { shop_id: match1[1], item_id: match1[2] };
    if (match2) return { shop_id: match2[1], item_id: match2[2] };

    return null;
}

// ✅ 生成分潤連結（乾淨URL）
function generateAffLink(url) {
    const ids = extractIds(url);
    if (!ids) return null;

    return `https://shopee.tw/product/${ids.shop_id}/${ids.item_id}?${AFF_PARAM}`;
}

// ✅ 清除
function clearAll() {
    document.getElementById("inputUrl").value = "";
    document.getElementById("result").innerText = "";
}

// ✅ 主流程
function handleLink(openPage) {
    const url = document.getElementById("inputUrl").value.trim();
    const resultDiv = document.getElementById("result");

    if (!url) {
        resultDiv.innerText = "❌ 請先貼上連結";
        return;
    }

    // ❗短網址提醒
    if (url.includes("shp.ee")) {
        resultDiv.innerHTML = "⚠️ 請先開啟短網址並複製最終商品頁";
        return;
    }

    const link = generateAffLink(url);

    if (!link) {
        resultDiv.innerText = "❌ 連結錯誤";
        return;
    }

    // ✅ 複製（含 fallback）
    navigator.clipboard.writeText(link).catch(() => {
        alert("請手動複製連結");
    });

    if (!openPage) {
        resultDiv.innerHTML = "✅ 已複製推廣連結";
        return;
    }

    // ✅ redirect（提高分潤成功率）
    const redirectUrl = `redirect.html?url=${encodeURIComponent(link)}`;

    window.location.href = redirectUrl;
}

</script>

</body>
</html>
